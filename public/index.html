<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1890ff" />
    <meta
            name="description"
            content="МАГАЗИНИЩЕ - тестовое задание с таблицей товаров и авторизацией"
    />
    <meta name="author" content="React Developer" />

    <!-- Open Graph мета-теги -->
    <meta property="og:title" content="МАГАЗИНИЩЕ" />
    <meta property="og:description" content="Тестовое задание с таблицей товаров и формой авторизации" />
    <meta property="og:type" content="website" />

    <!-- Иконки -->
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Шрифты -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

    <title>МАГАЗИНИЩЕ</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background-color: #f0f2f5;
        }

        #root {
            height: 100%;
        }

        .initial-loader {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
            background: linear-gradient(135deg, #1890ff 0%, #722ed1 100%);
            color: white;
        }

        .initial-loader__spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin-bottom: 20px;
        }

        .initial-loader__text {
            font-size: 18px;
            font-weight: 300;
            letter-spacing: 1px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
<noscript>
    <div style="
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #1890ff 0%, #722ed1 100%);
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        ">
        <div>
            <h1 style="font-size: 24px; margin-bottom: 16px;">JavaScript отключен</h1>
            <p style="font-size: 16px; opacity: 0.9;">
                Для работы этого приложения необходимо включить поддержку JavaScript в вашем браузере.
            </p>
        </div>
    </div>
</noscript>

<div id="root">
    <div class="initial-loader">
        <div class="initial-loader__spinner"></div>
        <div class="initial-loader__text">Загрузка приложения...</div>
    </div>
</div>
</body>
</html>
